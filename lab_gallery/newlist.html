---
layout: default
title: News
---

<div id="news-container" style="max-width: 800px; margin: auto; padding: 40px 20px;">
  <h2 id="news-title" style="font-size: 28px; margin-bottom: 20px;"></h2>
  <div id="news-images" style="margin-bottom: 20px;"></div>
  <div id="news-content" style="line-height: 1.8; font-size: 16px; color: #333;"></div>
</div>

<script>
  const BASE = '{{ "" | relative_url }}'; 
  const params = new URLSearchParams(window.location.search);
  const newsId = params.get('id');

  fetch(`${BASE}/data/news.json`)
    .then(res => {
      if (!res.ok) {
        throw new Error('Failed to load news.json');
      }
      return res.json();
    })
    .then(data => {
      const news = data.find(item => item.id === newsId);
      if (!news) {
        document.getElementById('news-container').innerHTML = '<p>News not found.</p>';
        return;
      }

      document.getElementById('news-title').innerText = news.title;

      const imagesContainer = document.getElementById('news-images');
      news.images.forEach(src => {
        const img = document.createElement('img');
        img.src = (/^https?:\/\//i.test(src)) ? src : `${BASE}/${src.replace(/^\/+/, '')}`;
        img.alt = 'news image';
        img.style = "width: 100%; max-width: 100%; margin-bottom: 15px; border-radius: 6px;";
        imagesContainer.appendChild(img);
      });

      document.getElementById('news-content').innerHTML = news.content;
    })
    .catch(err => {
      console.error('Error loading news:', err);
      document.getElementById('news-container').innerHTML = '<p>Error loading news.</p>';
    });
</script>
