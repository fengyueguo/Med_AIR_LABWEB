---
layout: default
title: News
---

<div id="news-container">
  <h2 id="news-title"></h2>
  <div id="news-images"></div>
  <div id="news-content"></div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const newsId = urlParams.get("id");

  fetch("/_data/news.yml") // ✅ 你也可以换成 `/news.yml` 如果你放在根目录
    .then(response => response.text())
    .then(yamlText => {
      const data = jsyaml.load(yamlText);
      const news = data.find(item => item.id === newsId);
      if (!news) {
        document.getElementById("news-container").innerHTML = "<p>News not found.</p>";
        return;
      }

      document.getElementById("news-title").textContent = news.title;

      const imgContainer = document.getElementById("news-images");
      news.images.forEach(src => {
        const img = document.createElement("img");
        img.src = src;
        img.style = "max-width: 100%; margin-bottom: 20px;";
        imgContainer.appendChild(img);
      });

      document.getElementById("news-content").innerHTML = news.content;
    })
    .catch(error => {
      console.error("Error loading news:", error);
      document.getElementById("news-container").innerHTML = "<p>Failed to load news.</p>";
    });
</script>

<!-- YAML Parser -->
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
