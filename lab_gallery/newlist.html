---
title: News Detail
layout: default
---

<h2 id="news-title">Loading...</h2>

<div id="news-images" style="margin-top: 20px;"></div>

<div id="news-content" style="margin-top: 30px; line-height: 1.7; font-size: 1em;"></div>

<style>
#news-images img {
  max-width: 100%;
  width: 100%;
  max-width: 800px;
  margin-bottom: 20px;
  border-radius: 8px;
  display: block;
}
</style>

<script>
  const params = new URLSearchParams(window.location.search);
  const newsId = params.get("id");

  fetch('/_data/news.json')
    .then(response => response.json())
    .then(data => {
      const newsItem = data.find(item => item.id === newsId);
      if (!newsItem) {
        document.getElementById("news-title").innerText = "News Not Found";
        return;
      }

      // 设置标题
      document.getElementById("news-title").innerText = newsItem.title;

      // 加载图片
      const imgContainer = document.getElementById("news-images");
      newsItem.images.forEach(src => {
        const img = document.createElement("img");
        img.src = src;
        img.alt = newsItem.title;
        imgContainer.appendChild(img);
      });

      // 加载正文
      document.getElementById("news-content").innerHTML = newsItem.content;
    })
    .catch(error => {
      console.error("Error loading news:", error);
      document.getElementById("news-title").innerText = "Failed to load news.";
    });
</script>
