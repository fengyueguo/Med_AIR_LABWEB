---
layout: default
title: News
---

<div id="news-container">
  <h2 id="news-title"></h2>
  <div id="news-images"></div>
  <div id="news-content"></div>
</div>

<script>
 const params = new URLSearchParams(window.location.search);
    const newsId = params.get('id');

    // 异步读取 JSON 数据
    fetch('/_data/news.json')
      .then(response => response.json())
      .then(data => {
        // 找到匹配的新闻项
        const item = data.find(news => news.id === newsId);

        if (!item) {
          document.getElementById('news-detail').innerHTML = '<p>News not found.</p>';
          return;
        }

        // 渲染新闻内容
        const html = `
          <h1>${item.title}</h1>
          ${item.images.map(img => `<img src="${img}" style="max-width:100%;margin:10px 0;">`).join('')}
          <div>${item.content}</div>
        `;
        document.getElementById('news-detail').innerHTML = html;
      })
      .catch(err => {
        console.error('Error loading news:', err);
        document.getElementById('news-detail').innerHTML = '<p>Error loading news.</p>';
      });
</script>

<!-- YAML Parser -->
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
